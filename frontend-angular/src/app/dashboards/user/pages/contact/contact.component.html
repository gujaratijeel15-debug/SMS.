<div class="contact-page">

  <!-- HERO -->
  <section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We're here to help. Reach out anytime.</p>
    <div class="hero-glow"></div>
  </section>


  <div class="contact-wrapper">

    <!-- CONTACT INFO -->
    <div class="contact-info">

      <div class="info-card">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <h3>Email</h3>
        <p>support&#64;sms.com</p>
      </div>

      <div class="info-card">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M22 16.92v3a2 2 0 0 1-2.18 2
  19.8 19.8 0 0 1-8.63-3.07
  19.5 19.5 0 0 1-6-6
  19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3
  a2 2 0 0 1 2 1.72c.12.9.37 1.78.73 2.61
  a2 2 0 0 1-.45 2.11L8.09 9.91
  a16 16 0 0 0 6 6l1.27-1.27
  a2 2 0 0 1 2.11-.45c.83.36 1.71.61 2.61.73
  A2 2 0 0 1 22 16.92z"></path>
</svg>
        <h3>Phone</h3>
        <p>+91 98765 43210</p>
      </div>

      <div class="info-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13
  a9 9 0 0 1 18 0z"></path>
  <circle cx="12" cy="10" r="3"></circle>
</svg>
        <h3>Location</h3>
        <p>Surat, Gujarat, India</p>
      </div>

    </div>


    <!-- FORM -->
    <form class="contact-form" (submit)="sendMessage($event)">

      <h2>Send Message</h2>
<br/>
      <input
        type="text"
        placeholder="Your Name"
        [(ngModel)]="form.name"
        name="name"
        required>

      <input
        type="email"
        placeholder="Your Email"
        [(ngModel)]="form.email"
        name="email"
        required>

      <textarea
        rows="5"
        placeholder="Your Message"
        [(ngModel)]="form.message"
        name="message"
        required></textarea>

      <button class="send-btn" [disabled]="loading" type="submit">

        <span *ngIf="!loading">Send Message</span>
        <span *ngIf="loading" class="loader"></span>

      </button>

      <div class="error-box" *ngIf="errorMsg">
        <span class="error-icon">X</span>
        <span class="error-text">{{ errorMsg }}</span>
      </div>

      <p class="success" *ngIf="successMsg">{{ successMsg }}</p>

    </form>

  </div>

</div>

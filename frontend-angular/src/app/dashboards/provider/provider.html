<div class="container mt-4">

  <h2 class="mb-3">Provider Dashboard</h2>
<div class="d-flex justify-content-between align-items-center mb-3">

  <h5 class="mb-0">Availability</h5>

  <button class="btn"
    [class.btn-success]="isAvailable"
    [class.btn-secondary]="!isAvailable"
    (click)="toggleAvailability()">
    {{ isAvailable ? 'Online' : 'Offline' }}
  </button>

</div>

  <div class="card shadow">

    <div class="card-header bg-dark text-white">
      Assigned Bookings
    </div>


    <table class="table mb-0">

      <thead>
        <tr>
          <th>User</th>
          <th>Address</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let b of bookings">

          <td>{{ b.user?.name }}</td>
          <td>{{ b.address }}</td>

          <td>
            <span class="badge bg-warning" *ngIf="b.status === 'pending'">Pending</span>
            <span class="badge bg-success" *ngIf="b.status === 'accepted'">Accepted</span>
            <span class="badge bg-danger" *ngIf="b.status === 'rejected'">Rejected</span>
          </td>

          <td>

            <div *ngIf="b.status === 'pending'">

              <button class="btn btn-sm btn-success me-2"
                      (click)="accept(b._id)">
                Accept
              </button>

              <button class="btn btn-sm btn-danger"
                      (click)="reject(b._id, 'Not available')">
                Reject
              </button>

            </div>

            <span *ngIf="b.status !== 'pending'"
                  class="text-muted">
              Action completed
            </span>

          </td>

        </tr>
      </tbody>

    </table>

  </div>

</div>

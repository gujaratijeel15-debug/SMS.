<div class="logo">
  SMS <span class="dot"></span>
</div>
<br/>
<h3>Reset Password</h3>
<p class="sub-text">Enter OTP and new password</p>

<input
  class="form-control"
  placeholder="Email"
  [(ngModel)]="email"
/>

<input
  class="form-control"
  placeholder="OTP"
  [(ngModel)]="otp"
/>

<input
  class="form-control"
  type="password"
  placeholder="New Password"
  [(ngModel)]="password"
/>

<button class="btn-primary" (click)="reset()">
  {{ loading ? 'Resetting...' : 'Reset Password' }}
</button>

<p class="error" *ngIf="error">{{ error }}</p>
<p class="switch" *ngIf="message">{{ message }}</p>

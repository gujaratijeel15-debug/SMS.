

<div class="logo">
  SMS <span class="dot"></span>
</div>
<br/>      <h3>Verify Your Account</h3>
      <p class="sub-text">Enter your email and verification code</p>

      <input
        class="form-control"
        placeholder="Email"
        [(ngModel)]="email"
      />

      <input
        class="form-control"
        placeholder="Verification Code"
        [(ngModel)]="otp"
      />

      <button class="btn-primary" (click)="verify()">
        Verify Account
      </button>

      <p class="error" *ngIf="error">{{ error }}</p>

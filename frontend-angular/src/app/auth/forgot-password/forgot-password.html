<form (ngSubmit)="sendOTP()">

<div class="logo">
  SMS <span class="dot"></span>
</div>
<br/>  <h3>Forgot Password</h3>
  <p class="sub-text">Enter your email to receive OTP</p>

  <input
    class="form-control"
    placeholder="Enter your email"
    [(ngModel)]="email"
    name="email"
    required
    [disabled]="loading"
  />

  <button class="btn-primary" type="submit" [disabled]="loading">
    {{ loading ? 'Sending...' : 'Send OTP' }}
  </button>

  <p class="switch" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

</form>
